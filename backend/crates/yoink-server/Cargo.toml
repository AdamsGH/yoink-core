[package]
name = "yoink-server"
default-run = "yoink-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-fixtures = ["dep:turso", "yoink-insight/test-fixtures", "yoink-telegram/test-fixtures"]

[[bin]]
name = "yoink-fixture-server"
path = "src/fixture_main.rs"
required-features = ["test-fixtures"]

[dependencies]
yoink-inbox = { path = "../yoink-inbox" }
yoink-insight = { path = "../yoink-insight" }
yoink-user-session = { path = "../yoink-user-session" }
turso = { version = "=0.7.2", optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
yoink-application.workspace = true
yoink-http.workspace = true
yoink-storage.workspace = true
yoink-telegram.workspace = true
yoink-identity.workspace = true
yoink-auth.workspace = true
yoink-downloads.workspace = true
yoink-executor.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
yoink-db.workspace = true
yoink-domain.workspace = true

[lints]
workspace = true
