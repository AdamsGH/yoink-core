[telegram]
help_enabled = "Доступно: /start, /help, /status, /download URL, /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /cut URL START END, /job ID, /cancel ID. Параметры формата для /video, /audio, /image, /playlist, /cut: --height best|N (1-100000), --video-codec h264|h265|av1|vp9|any, --audio-codec best|aac|mp3|opus, --container mp4|mkv|webm, --send-as-file true|false, --gallery-zip true|false. Если параметр не указан, применяются сохранённые настройки формата. Набор параметров зависит от команды. Диапазоны: N, -N или A-B; /playlist по умолчанию выбирает элементы 1-20, /audio N выбирает элемент N. Диапазон перед URL выбирает элементы плейлиста, даже если в ссылке есть t/start. /cut принимает секунды или абсолютные границы HH:MM:SS. Во встроенных фрагментах URL?t=START DURATION и URL START DURATION второе значение в секундах задаёт длительность; границы HH:MM:SS абсолютны. t/start принимают секунды или формы 1h2m3s и 25m10s. /subs URL отправляет субтитры отдельными документами. Параметры: --subtitle-language CODE (en, ru, zh-Hans), --subtitle-auto true|false. Без параметров используются сохранённые настройки субтитров."
help_basic = "Доступна диагностика: /start, /help, /status."
usage_download = "Формат: /download URL (без изменений, параметры не поддерживаются); /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /cut URL START END. Параметры формата для этих пяти команд: --height best|N (1-100000), --video-codec h264|h265|av1|vp9|any, --audio-codec best|aac|mp3|opus, --container mp4|mkv|webm, --send-as-file true|false, --gallery-zip true|false. Если параметр не указан, применяются сохранённые настройки формата. Набор параметров зависит от команды. Также: /job ID, /cancel ID. Диапазоны: N, -N или A-B. /cut и встроенные фрагменты принимают секунды или границы HH:MM:SS. /subs URL отправляет субтитры отдельными документами. Параметры: --subtitle-language CODE (en, ru, zh-Hans), --subtitle-auto true|false. Без параметров используются сохранённые настройки субтитров."
