[telegram]
help_enabled = "Доступно: /start, /help, /status, /download URL, /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /cut URL START END, /job ID, /cancel ID. Диапазоны: N, -N или A-B; без диапазона /playlist выбирает элементы 1-20, а /audio N выбирает элемент N. Диапазон перед URL выбирает элементы плейлиста, даже если в ссылке есть t/start. /cut принимает неотрицательные десятичные секунды (или абсолютные границы HH:MM:SS); второе число задаёт длительность, если оно меньше START, иначе абсолютный конец. Для фрагмента URL?t=START DURATION и URL START DURATION второе значение в секундах задаёт длительность; URL HH:MM:SS HH:MM:SS задаёт абсолютные границы. Второй аргумент в формате с двоеточиями всегда абсолютный, в том числе после t=. t/start принимают секунды или формы 1h2m3s и 25m10s."
help_basic = "Доступна диагностика: /start, /help, /status."
