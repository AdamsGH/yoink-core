[telegram]
help_enabled = "Available: /start, /help, /status, /download URL, /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /cut URL START END, /job ID, /cancel ID. Ranges: N, -N, or A-B; /playlist defaults to items 1-20, while /audio N selects item N. A range before URL remains a playlist selector even when the URL contains t/start. /cut accepts unsigned decimal seconds (or HH:MM:SS absolute endpoints); its second number is a duration when less than START, otherwise an absolute end. Inline clips: URL?t=START DURATION and URL START DURATION treat the second unsigned-seconds value as a duration; URL HH:MM:SS HH:MM:SS uses absolute endpoints. A colon-form second endpoint is always absolute, including after t=. t/start accept seconds or forms such as 1h2m3s and 25m10s."
