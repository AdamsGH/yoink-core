help_enabled = "Available: /start, /help, /status, /lang, /cookie, /settings, /format, /subs, /quality, /download URL, /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /list URL, /cut URL START END, /job ID, /cancel ID. Use /list URL to inspect source formats without downloading media. Use /quality to resume a saved quality-choice draft. Upload a Netscape cookie document with caption /cookie [DOMAIN] (512 KiB maximum). Format flags for /video, /audio, /image, /playlist, /cut: --height best|N (1-100000), --video-codec h264|h265|av1|vp9|any, --audio-codec best|aac|mp3|opus, --container mp4|mkv|webm, --send-as-file true|false, --gallery-zip true|false. Stored format settings apply when a flag is absent. Flags vary by mode. Ranges: N, -N, or A-B; /playlist defaults to items 1-20, while /audio N selects item N. A range before URL remains a playlist selector even when the URL contains t/start. /cut accepts unsigned decimal seconds or HH:MM:SS endpoints. Inline clips: URL?t=START DURATION and URL START DURATION treat the second seconds value as a duration; HH:MM:SS endpoints are absolute. t/start accept seconds or forms such as 1h2m3s and 25m10s. /subs URL sends standalone subtitle documents. Optional: --subtitle-language CODE (en, ru, zh-Hans), --subtitle-auto true|false. Absent flags inherit saved subtitle preferences."
help_basic = "Available diagnostics: /start, /help, /status. Choose reply language with /lang."
user_help_enabled = "Send a public HTTP(S) link to download supported video, audio, or gallery media. You can also use /download URL, /video URL, /audio URL, and /image URL. Check an operation with /job ID or cancel your own operation with /cancel ID. Use /lang in private chat to change the interface language. Personal /settings or /format edits non-secret media preferences. Saved quality ask opens a per-download chooser; /quality resumes it; /list URL lists formats. Private /cut URL supports clip dialogs; /playlist URL supports ranges. /subs edits subtitle language and automatic subtitles, or /subs URL downloads subtitles. Media commands accept the supported non-secret format overrides. Use /cookie and /proxy in private chat for personal cookies and proxy use. System controls are not ordinary-user commands."
user_help_basic = "Available: /start and /help. Downloads are currently unavailable."
registration_pending = "Your account is awaiting approval. Please try again later."
usage_download = "Usage: /download URL (unchanged, no flags); /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /list URL, /cut URL START END. Use /list URL to inspect source formats without downloading media. Format flags on these five commands: --height best|N (1-100000), --video-codec h264|h265|av1|vp9|any, --audio-codec best|aac|mp3|opus, --container mp4|mkv|webm, --send-as-file true|false, --gallery-zip true|false. Stored format settings apply when a flag is absent. Flags vary by mode. Also: /job ID, /cancel ID. Ranges: N, -N, or A-B. /cut and inline clips accept unsigned seconds or HH:MM:SS endpoints. /subs URL sends standalone subtitle documents. Optional: --subtitle-language CODE (en, ru, zh-Hans), --subtitle-auto true|false. Absent flags inherit saved subtitle preferences."
