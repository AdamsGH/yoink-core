[telegram]
help_enabled = "Available: /start, /help, /status, /download URL, /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /cut URL START END, /job ID, /cancel ID. Format flags for /video, /audio, /image, /playlist, /cut: --height best|N (1-100000), --video-codec h264|h265|av1|vp9|any, --audio-codec best|aac|mp3|opus, --container mp4|mkv|webm, --send-as-file true|false, --gallery-zip true|false. Stored format settings apply when a flag is absent. Flags vary by mode. Ranges: N, -N, or A-B; /playlist defaults to items 1-20, while /audio N selects item N. A range before URL remains a playlist selector even when the URL contains t/start. /cut accepts unsigned decimal seconds or HH:MM:SS endpoints. Inline clips: URL?t=START DURATION and URL START DURATION treat the second seconds value as a duration; HH:MM:SS endpoints are absolute. t/start accept seconds or forms such as 1h2m3s and 25m10s."
help_basic = "Available diagnostics: /start, /help, /status."
usage_download = "Usage: /download URL (unchanged, no flags); /video URL, /audio [range] URL, /image URL, /playlist [range] URL, /cut URL START END. Format flags on these five commands: --height best|N (1-100000), --video-codec h264|h265|av1|vp9|any, --audio-codec best|aac|mp3|opus, --container mp4|mkv|webm, --send-as-file true|false, --gallery-zip true|false. Stored format settings apply when a flag is absent. Flags vary by mode. Also: /job ID, /cancel ID. Ranges: N, -N, or A-B. /cut and inline clips accept unsigned seconds or HH:MM:SS endpoints."
