# Deterministic override: removes ALL provider egress and replaces BOTH upstreams.
services:
  youtubei:
    command: [node, test/synthetic-server.mjs]
    networks: !override [services]
  bgutil:
    build:
      context: ..
      dockerfile: backend/Dockerfile.youtube-auth-bgutil-fixture
    image: yoink-youtube-auth-bgutil:fixture
    user: "10001:10001"
    entrypoint: [node]
    command: [/opt/youtube-auth-bgutil.mjs]
    networks: !override [services]
    tmpfs: !override ['/tmp:size=16m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev']
  worker:
    # Resolve the public source name deterministically without DNS/provider contact.
    # The worker has network_mode:none; actual traffic is ONLY the fixed Unix socket.
    # This is not a private-origin exception and changes no guard implementation.
    extra_hosts: ["youtu.be:93.184.216.34"]
