[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
yoink-access = { path = "crates/yoink-access" }
yoink-identity = { path = "crates/yoink-identity" }
yoink-storage = { path = "crates/yoink-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
yoink-domain = { path = "crates/yoink-domain" }
yoink-application = { path = "crates/yoink-application" }
yoink-http = { path = "crates/yoink-http" }
yoink-telegram = { path = "crates/yoink-telegram" }
yoink-worker-protocol = { path = "crates/yoink-worker-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
