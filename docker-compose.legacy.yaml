# Stop native first. After native writes, require verified reverse migration or an explicit data-loss decision.
services:
  yoink-postgres:
    profiles: !reset []
  yoink-redis:
    profiles: !reset []
  yoink-youtubei:
    profiles: !reset []
  bgutil:
    profiles: !reset []
  native-youtube-auth-gateway:
    profiles: [native]
  yoink:
    image: "${yoink_legacy_image:-yoink/yoink:latest}"
    container_name: yoink
    build: !override
      context: .
      dockerfile: docker/Dockerfile
    user: !reset null
    read_only: false
    cap_drop: !reset []
    security_opt: !reset []
    tmpfs: !reset []
    stop_grace_period: 30s
    restart: unless-stopped
    env_file: .env
    environment: !override
      BOT_API_URL: "http://tg-bot-api:8082"
      MUSIC_PROXY_URL: "${proxy_url:-}"
    depends_on: !override
      yoink-postgres:
        condition: service_healthy
      yoink-redis:
        condition: service_healthy
      tg-bot-api:
        condition: service_healthy
      bgutil:
        condition: service_healthy
      yoink-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - ./data/cookies:/app/data/cookies
      - ./data/kasm/profile/chromium:/app/data/browser-profile:ro
      - ./data/tg-bot-api:/app/data/tg-bot-api:ro
    networks:
      - yoink
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "500M"
        max-file: "3"

  yoink-arq-worker:
    profiles: !reset []
