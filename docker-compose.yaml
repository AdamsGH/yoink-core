name: yoink

services:
  yoink-postgres:
    profiles: [legacy, backup]
    image: postgres:16-alpine
    container_name: yoink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoink
      POSTGRES_USER: yoink
      POSTGRES_PASSWORD: yoink
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - yoink
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoink -d yoink"]
      interval: 5s
      timeout: 5s
      retries: 10

  yoink-redis:
    profiles: [legacy]
    image: redis:7-alpine
    container_name: yoink-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    networks:
      - yoink
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  yoink-proxy-init:
    image: busybox:latest
    container_name: yoink-proxy-init
    profiles: [legacy]
    restart: "no"
    env_file: .env
    environment:
      BOT_API_URL: "http://tg-bot-api:8082"
      socks5_host: "host.docker.internal"
      socks5_port: "1080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "/init-proxy.sh"]
    volumes:
      - ./docker/init-proxy.sh:/init-proxy.sh:ro
      - ./data/tg-bot-api:/data/tg-bot-api:ro
    networks:
      - yoink
    depends_on:
      tg-bot-api:
        condition: service_healthy

  yoink:
    container_name: yoink
    restart: unless-stopped
    env_file: .env
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [yoink]
    ports: ["8003:8000"]
    logging:
      driver: local
      options: {max-size: "500M", max-file: "3"}
    image: "${yoink_rust_image:?Set yoink_rust_image to a SemVer release with backend/justfile release-init}"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 165s
    tmpfs:
      - /tmp/yoink-work:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
      - /tmp/yoink-music:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
      - /tmp/yoink-insight:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
      - /tmp/yoink-inbox:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    environment:
      YOINK_RUST_STARTUP_TIMEOUT_SECS: "300"
      YOINK_RUST_SHUTDOWN_TIMEOUT_SECS: "150"
      YOINK_RUST_HTTP_BIND: "0.0.0.0:8000"
      YOINK_RUST_DATABASE_PATH: /state/native.db
      YOINK_RUST_TELEGRAM_ENABLED: "true"
      YOINK_RUST_TELEGRAM_TOKEN: "${bot_token}"
      YOINK_RUST_OWNER_ID: "${owner_id}"
      YOINK_RUST_BOT_API_FILE_ROOT: /var/lib/telegram-bot-api
      YOINK_RUST_TELEGRAM_LOCAL_FILE_ROOT: /telegram-files
      YOINK_RUST_BOT_API_URL: "http://tg-bot-api:8082"
      YOINK_RUST_TELEGRAM_GROUPS_ENABLED: "true"
      YOINK_RUST_AUTH_ENABLED: "true"
      YOINK_RUST_API_SECRET_KEY: "${api_secret_key}"
      YOINK_RUST_DOWNLOADS_ENABLED: "true"
      YOINK_RUST_DOWNLOAD_MAX_BYTES: "${YOINK_RUST_DOWNLOAD_MAX_BYTES:-2000000000}"
      YOINK_RUST_DOWNLOAD_WORKSPACE_MAX_BYTES: "${YOINK_RUST_DOWNLOAD_WORKSPACE_MAX_BYTES:-8000000000}"
      YOINK_RUST_MUSIC_ENABLED: "true"
      YOINK_RUST_STATS_ENABLED: "true"
      YOINK_RUST_INSIGHT_ENABLED: "true"
      YOINK_RUST_INSIGHT_AI_PROXY: "${YOINK_RUST_INSIGHT_AI_PROXY:-${proxy_upstream_url:-socks5://host.docker.internal:1080}}"
      YOINK_RUST_INBOX_ENABLED: "true"
      YOINK_RUST_YOUTUBE_AUTH_ADAPTER_ENABLED: "true"
      YOINK_RUST_COOKIE_WEB_ORIGIN: "https://${yoink_domain}/"
      YOINK_RUST_DOWNLOAD_WORKSPACE: /state/work/downloads
      YOINK_RUST_MUSIC_WORKSPACE: /tmp/yoink-music
      YOINK_RUST_INSIGHT_WORKSPACE: /tmp/yoink-insight
      YOINK_RUST_INBOX_WORKSPACE: /tmp/yoink-inbox
      YOINK_RUST_STATS_INDEX_DIR: /state/stats-search
      YOINK_RUST_STATS_IMPORT_ROOT: /state/stats-import
      TMPDIR: /tmp/yoink-work
      TURSO_TMPDIR: /tmp/yoink-work
    volumes: !override
      - ./data/native:/state
      - ./data/tg-bot-api:/telegram-files:ro
      - native-youtube-auth:/run/yoink-youtube-auth:ro
    depends_on:
      tg-bot-api: {condition: service_healthy}
      yoink-proxy: {condition: service_started}
      native-youtube-auth-gateway:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]

  yoink-arq-worker:
    profiles: [legacy]
    image: yoink/yoink:latest
    container_name: yoink-arq-worker
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "arq", "yoink_inbox.worker.WorkerSettings"]
    depends_on:
      yoink-postgres:
        condition: service_healthy
      yoink-redis:
        condition: service_healthy
    networks:
      - yoink
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: local
      options:
        max-size: "100M"
        max-file: "3"

  yoink-frontend:
    image: yoink/frontend:latest
    container_name: yoink-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    networks:
      - yoink
    ports:
      - "3010:80"
    depends_on:
      yoink:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  yoink-nginx:
    image: yoink/nginx:latest
    container_name: yoink-nginx
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    restart: unless-stopped
    environment:
      DEV_ALLOWED_CIDR: ${DEV_ALLOWED_CIDR:-127.0.0.1/32}
    networks:
      - yoink
    ports:
      - "8081:8081"
    depends_on:
      yoink:
        condition: service_healthy
      yoink-frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  tg-bot-api:
    image: yoink/tg-bot-api:latest
    container_name: tg-bot-api
    build:
      context: .
      dockerfile: docker/Dockerfile.tg-bot-api
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      TELEGRAM_API_ID: "${api_id}"
      TELEGRAM_API_HASH: "${api_hash}"
      TELEGRAM_LOCAL: "true"
      TELEGRAM_HTTP_PORT: "8082"
      TELEGRAM_ALLOW_USERS: "true"
      TELEGRAM_ALLOW_USERS_REGISTRATION: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data/tg-bot-api:/var/lib/telegram-bot-api
      - ./docker/tg-bot-api-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - yoink
    healthcheck:
      test: ["CMD-SHELL", "wget -S -Y off http://127.0.0.1:8082/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  yoink-youtubei:
    profiles: [legacy]
    image: yoink/youtubei:latest
    container_name: yoink-youtubei
    build:
      context: .
      dockerfile: docker/Dockerfile.youtubei
    restart: unless-stopped
    networks:
      - yoink
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9173/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  # HTTP facade over the host SOCKS proxy. yt-dlp can use SOCKS directly, but
  # ffmpeg's HTTP client (used for time-range downloads) only supports an HTTP
  # CONNECT proxy. Keeping the bridge inside the compose network gives both
  # clients one proxy URL and prevents ffmpeg from silently going direct.
  yoink-proxy:
    image: gogost/gost:3.3.0
    container_name: yoink-proxy
    restart: unless-stopped
    command:
      - "-L"
      - "http://:8080"
      - "-F"
      - "${proxy_upstream_url:-socks5://host.docker.internal:1080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yoink
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  bgutil:
    profiles: [legacy]
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil
    restart: unless-stopped
    environment:
      PROXY: "${proxy_url:-}"
    depends_on:
      yoink-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yoink
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4416/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  yoink-backup:
    image: yoink/backup:latest
    container_name: yoink-backup
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    entrypoint: ["/cron-entry.sh"]
    restart: unless-stopped
    profiles:
      - backup
    environment:
      TZ: "Europe/Moscow"
      PGHOST: yoink-postgres
      PGUSER: yoink
      PGPASSWORD: yoink
      PGDATABASE: yoink
      BACKUP_S3_ENDPOINT: "${backup_s3_endpoint:-}"
      BACKUP_S3_BUCKET: "${backup_s3_bucket:-yoink-backups}"
      BACKUP_S3_ACCESS_KEY: "${backup_s3_access_key:-}"
      BACKUP_S3_SECRET_KEY: "${backup_s3_secret_key:-}"
      BACKUP_S3_REGION: "${backup_s3_region:-garage}"
      BACKUP_RETAIN_DAILY: "${backup_retain_daily:-7}"
      BACKUP_RETAIN_WEEKLY: "${backup_retain_weekly:-4}"
      BACKUP_CRON_SCHEDULE: "${backup_cron_schedule:-0 3 * * *}"
    depends_on:
      yoink-postgres:
        condition: service_healthy
    networks:
      - yoink
    logging:
      driver: local
      options:
        max-size: "10M"
        max-file: "3"

  yoink-browser:
    image: kasmweb/chromium:1.18.0-rolling-daily
    container_name: yoink-browser
    profiles:
      - cookies
    restart: "no"
    environment:
      VNC_PW: "${kasm_vnc_pw}"
      LAUNCH_URL: "${kasm_launch_url:-https://www.youtube.com}"
      KASM_RESTRICTED_FILE_CHOOSER: "0"
      VNCOPTIONS: "-disableBasicAuth -PreferBandwidth -DynamicQualityMin=4 -DynamicQualityMax=7 -DLP_ClipDelay=0"
    ports:
      - "6902:6901"
    shm_size: 1gb
    volumes:
      - ./data/cookies:/home/kasm-user/cookies
      - ./data/kasm/profile:/home/kasm-user/.config
    networks:
      - yoink
    logging:
      driver: local
      options:
        max-size: "50M"
        max-file: "3"

  native-youtube-auth-gateway:
    image: "${yoink_youtube_image:-yoink/youtube-services:0.1.0}"
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 165s
    mem_limit: 1536m
    cpus: 2
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
    environment:
      YOINK_YOUTUBE_AUTH_SOCKET: /run/yoink-youtube-auth/adapter.sock
      PROXY: "${proxy_url:-http://yoink-proxy:8080}"
      HTTP_PROXY: "${proxy_url:-http://yoink-proxy:8080}"
      HTTPS_PROXY: "${proxy_url:-http://yoink-proxy:8080}"
      NO_PROXY: localhost,127.0.0.1,::1
    depends_on:
      yoink-proxy: {condition: service_started}
    volumes: [native-youtube-auth:/run/yoink-youtube-auth]
    networks: [yoink]
networks:
  yoink:
    name: yoink
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: 10.10.0.0/24

volumes:
  postgres-data:
  redis-data:
  native-youtube-auth:
